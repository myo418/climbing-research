<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" data-term="carabiner"
     fill="none" stroke="#1a1a1a" stroke-linecap="round" stroke-linejoin="round">
  <title>カラビナ</title>
  <desc>環状の金属に開閉するゲートが付いた連結具。ここではねじ式のロックが付いた安全環付き。</desc>

  <!-- フレーム外形（オフセットD型。左が背、右がゲート側） -->
  <path d="M 150 40 C 136 28 110 24 92 34 C 74 45 66 68 66 98 C 66 132 74 166 90 190 C 103 209 124 217 142 211 C 159 205 169 190 172 172" stroke-width="1.6"/>
  <!-- フレーム内側 -->
  <path d="M 146 56 C 134 46 114 42 100 50 C 86 59 80 77 80 100 C 80 130 87 160 101 180 C 112 196 128 202 142 197 C 155 192 160 178 161 166" stroke-width="1.6"/>
  <!-- I ビームの溝（強度を出すための断面。背側だけに出る） -->
  <path d="M 73 98 C 73 130 80 162 94 184" stroke-width="0.6"/>
  <path d="M 96 40 C 84 49 76 66 74 86" stroke-width="0.6"/>
  <path d="M 100 196 C 112 205 128 209 140 205" stroke-width="0.6"/>

  <!-- ロープが当たる面（底の内側に付く摩耗の段） -->
  <path d="M 104 186 C 114 197 128 201 140 197" stroke-width="0.6"/>

  <!-- ゲート -->
  <path d="M 172 172 C 172 140 166 82 152 44" stroke-width="1.6"/>
  <path d="M 161 166 C 161 138 155 86 143 52" stroke-width="1.6"/>

  <!-- ノーズ（フレーム側の掛かり） -->
  <path d="M 150 40 C 154 42 156 47 152 44" stroke-width="1"/>
  <path d="M 146 56 C 150 54 152 50 152 46" stroke-width="1"/>
  <path d="M 147 48 L 143 52" stroke-width="0.6"/>

  <!-- ヒンジ（リベット） -->
  <path d="M 166 176 C 166 171 170 168 174 170 C 178 172 178 178 175 180 C 171 182 167 180 166 176" stroke-width="1"/>
  <circle cx="171" cy="175" r="1.5" fill="#1a1a1a" stroke-width="0.6"/>

  <!-- ねじ式ロックスリーブ -->
  <path d="M 168 142 C 160 142 157 142 157 142" stroke-width="0.6"/>
  <path d="M 170 146 L 159 148" stroke-width="1"/>
  <path d="M 165 104 L 154 106" stroke-width="1"/>
  <path d="M 170 146 C 172 132 170 118 165 104" stroke-width="1.6"/>
  <path d="M 159 148 C 161 134 159 120 154 106" stroke-width="1.6"/>
  <path d="M 168 138 L 157 140" stroke-width="0.6"/>
  <path d="M 167 130 L 156 132" stroke-width="0.6"/>
  <path d="M 166 122 L 155 124" stroke-width="0.6"/>
  <path d="M 165 114 L 154 116" stroke-width="0.6"/>

  <!-- ゲートが開く向き -->
  <path d="M 150 74 C 138 78 130 86 126 96" stroke="#6b1a14" stroke-width="1" stroke-dasharray="1 4"/>
  <path d="M 126 96 C 130 94 134 93 137 93" stroke="#6b1a14" stroke-width="1"/>
  <path d="M 126 96 C 127 92 128 89 130 86" stroke="#6b1a14" stroke-width="1"/>
</svg>
